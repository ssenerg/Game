# The image's settings: everything else is at its default (see
# ../server.toml.example). To change them, mount your own file at
# /etc/snaketui/server.toml.

# docker-compose.yml publishes these on the host. The admin port has no
# password: publish it on the host's loopback only (127.0.0.1:9022:9022),
# never to the internet.
listen = "0.0.0.0:2222"
admin_listen = "0.0.0.0:9022"

# Both in the volume at /var/lib/snaketui: keep it.
host_key = "/var/lib/snaketui/host_ed25519_key"
database = "sqlite:///var/lib/snaketui/snaketui.db"

# Snake and chess: new players pick one, and `ssh chess@host` opens chess.
enabled_games = ["snake", "chess"]

# docker-compose.yml's DragonflyDB: the rate limits count there, and reads
# such as the leaderboard are kept there a while. While it doesn't answer,
# the game counts in its own memory, and warns about it once a minute.
[cache]
url = "redis://dragonfly:6379"
